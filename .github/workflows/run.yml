name: Run Stock Bot

on:
  schedule:
    # 日本時間 11:35（前引け後） -> UTC 2:35
    - cron: '35 2 * * 1-5'
    # 日本時間 15:05（大引け後） -> UTC 6:05
    - cron: '5 6 * * 1-5'
  workflow_dispatch: # 手動テスト実行用ボタン

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: コードの取得
        uses: actions/checkout@v4

      - name: Pythonの準備
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ライブラリのインストール
        run: pip install yfinance tweepy

      - name: Botの実行
        env:
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python bot.py
